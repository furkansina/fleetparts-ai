<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleetParts AI - Ağır Vasıta Parça Asistanı</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #d9534f; text-align: center; }
        .section { margin-bottom: 30px; padding: 20px; border: 1px solid #ddd; border-radius: 6px; background: #fafafa; }
        label { font-weight: bold; display: block; margin-top: 10px; }
        input, select, button { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #d9534f; color: white; font-weight: bold; cursor: pointer; border: none; margin-top: 15px; }
        button:hover { background-color: #c9302c; }
        pre { background: #272822; color: #f8f8f2; padding: 15px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>

<div class="container">
    <h1>FleetParts AI 🚚</h1>
    
    <!-- Katalog Yükleme Bölümü -->
    <div class="section">
        <h3>1. Katalog / PDF / Görsel Yükle</h3>
        <form id="catalogForm">
            <input type="file" name="files" multiple accept=".pdf, .png, .jpg, .jpeg">
            <button type="submit">Katalog Dosyalarını İşle ve Ekle</button>
        </form>
    </div>

    <!-- Parça Analiz ve Satış Asistanı Bölümü -->
    <div class="section">
        <h3>2. Parça Fotoğrafı İncele & Satış Mesajı Üret</h3>
        <form id="partForm">
            <label>Parça Fotoğrafı:</label>
            <input type="file" name="file" accept="image/*" required>
            
            <label>Müşteri Tipi:</label>
            <select name="customer_type">
                <option value="Anadolu Toptancısı">Anadolu Toptancısı</option>
                <option value="Servis Ustası">Servis Ustası</option>
                <option value="Filo Sahibi">Filo Sahibi</option>
            </select>

            <label>Fiyat Notu (İsteğe Bağlı):</label>
            <input type="text" name="price_note" placeholder="Örn: 1.250 TL + KDV">

            <button type="submit">Yapay Zeka Ajanlarını Çalıştır</button>
        </form>
    </div>

    <!-- Sonuç Ekranı -->
    <div class="section">
        <h3>Sonuçlar / Ajan Çıktıları</h3>
        <pre id="output">İşlem bekleniyor...</pre>
    </div>
</div>

<script>
    document.getElementById('catalogForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        document.getElementById('output').innerText = "Katalog dosyaları işleniyor, lütfen bekleyin...";
        
        try {
            const res = await fetch('/upload-catalog-files/', { method: 'POST', body: formData });
            const data = await res.json();
            document.getElementById('output').innerText = JSON.stringify(data, null, 2);
        } catch (err) {
            document.getElementById('output').innerText = "Hata oluştu: " + err;
        }
    });

    document.getElementById('partForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        document.getElementById('output').innerText = "Parça analiz ediliyor ve satış mesajı hazırlanıyor...";
        
        try {
            const res = await fetch('/process-part/', { method: 'POST', body: formData });
            const data = await res.json();
            document.getElementById('output').innerText = JSON.stringify(data, null, 2);
        } catch (err) {
            document.getElementById('output').innerText = "Hata oluştu: " + err;
        }
    });
</script>

</body>
</html>
