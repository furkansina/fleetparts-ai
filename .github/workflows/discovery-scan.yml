name: Haftalık Lead Keşif Taraması

on:
  schedule:
    - cron: '17 2 * * 1'  # Her Pazartesi 02:17 UTC - tam saatten kaydırılmış, yoğunluk saatini atlar
  workflow_dispatch: {}

concurrency:
  group: discovery-scan
  cancel-in-progress: false  # yeni koşu, öncekini iptal etmez, kuyrukta bekler - leads.json çakışmasını önler

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bağımlılıkları kur
        run: pip install requests

      - name: Taramayı çalıştır
        # NOT (2026-08-12): OSM/Overpass kaynağı iki taramada da (yavaşlık + "network unreachable"
        # hatası) 150dk'lık TÜM süreyi tüketip SIFIR yeni sonuç getirdi - zaten iyi kapsanan
        # (2964 kayıt) bu kaynak, gerçekten yeni veri üreten find.com.tr/sanayisitesi.com.tr gibi
        # kaynaklara ayrılan süreyi/güvenilirliği riske atıyordu. Geçici olarak --skip-osm ile
        # kapatıldı - diğer kaynaklar dakikalar içinde bitip güvenle commit edilebilsin diye.
        # Overpass'ın güvenilirliği düzelirse (ya da farklı bir ayna eklenirse) tekrar açılabilir.
        run: python scripts/run_discovery.py --skip-osm
        timeout-minutes: 150
        env:
          # BUG (2026-08-12'de tespit edildi): GOOGLE_PLACES_API_KEY GitHub Secrets'a eklenmişti
          # ama workflow adımına HİÇ aktarılmıyordu - lead_sources_google_places.py'nin
          # is_configured() kontrolü bu yüzden hep False dönüyordu, Google Places hiç çalışmadı
          # (ücret de oluşmadı, ama beklenen sonuç da gelmedi). Artık doğru şekilde bağlandı.
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}

      - name: Değişiklikleri commit et
        if: always()
        # NOT (2026-08-11): önceden burada git rebase kullanılıyordu - tarama 2.5 saate kadar
        # sürebildiği için o kadar uzun sürede leads.json GitHub'da başka commit'lerle defalarca
        # değişiyor, ve git bu büyüklükte bir JSON blob'unu satır bazında güvenilir uzlaştıramıyor
        # (gerçek bir taramada CONFLICT verip TÜM taramanın kaybolmasına yol açtı). Artık git hiç
        # satır-uzlaşması yapmıyor: origin/main'in TAZE leads.json'u çekilir, sadece BU taramanın
        # kendi bulduğu yeni kayıtlar (new_leads_this_run.json, run_discovery.py tarafından
        # aralıksız güncellenir) Python/dedupe seviyesinde üzerine eklenir (scripts/merge_new_
        # leads.py).
        #
        # BUG (2026-08-12'de canlıda tespit edildi, GERÇEK VERİ KAYBINA yol açtı - 15.921 yeni
        # lead bulunup TAMAMEN kaybedildi): "git checkout origin/main -- leads.json" SADECE dosya
        # İÇERİĞİNİ günceller, yerel dal HEAD'ini origin/main'e TAŞIMAZ. Bu run sürerken (2.5 saat)
        # ben elle app.py/lead_scoring.py/leads.json gibi dosyalara defalarca doğrudan push
        # yaptığım için origin/main sürekli ilerledi - ama bu döngü her denemede HÂLÂ eski
        # (checkout anındaki) HEAD üzerinden commit atıp push etmeye çalışıyordu, bu yüzden 5
        # denemenin HEPSİ "non-fast-forward" ile reddedildi - retry hiç işe yaramadı çünkü asıl
        # sorunu (eski HEAD) hiç düzeltmiyordu. Artık her denemede "git reset --hard origin/main"
        # ile yerel dal GERÇEKTEN en güncel origin/main'e taşınıyor, ondan SONRA yeni kayıtlar
        # tekrar birleştirilip commit ediliyor - bu sayede kaç kez araya başka bir push girerse
        # girsin, bir sonraki deneme her zaman güncel bir temelden başlar ve başarılı olur.
        run: |
          git config user.name "fleetparts-discovery-bot"
          git config user.email "actions@github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/merge_new_leads.py
            git add leads.json
            if git diff --staged --quiet; then
              echo "Değişiklik yok (yeni lead bulunamadı ya da hepsi zaten mevcut)."
              break
            fi
            git commit -m "Otomatik lead taraması $(date -u +%Y-%m-%d)"
            if git push origin HEAD:main; then
              echo "Push başarılı (deneme $i)."
              break
            fi
            echo "Push başarısız (deneme $i/5), yeniden denenecek..."
            sleep 5
          done
