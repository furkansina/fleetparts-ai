name: Haftalık Lead Keşif Taraması

on:
  schedule:
    - cron: '17 2 * * 1'  # Her Pazartesi 02:17 UTC - tam saatten kaydırılmış, yoğunluk saatini atlar
  workflow_dispatch: {}

concurrency:
  group: discovery-scan
  cancel-in-progress: false  # yeni koşu, öncekini iptal etmez, kuyrukta bekler - leads.json çakışmasını önler

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bağımlılıkları kur
        run: pip install requests

      - name: Taramayı çalıştır
        run: python scripts/run_discovery.py
        # NOT: 45dk gercek bir kosuda YETERSIZ cikti (2026-08-10) - Overpass sunuculari o gun
        # cok yavasti, eklenen retry/backoff mantigi (veri kaybini onlemek icin gerekli) taramayi
        # guvenilir ama daha uzun surdurebiliyor. Is "if: always()" ile commit adimina her turlu
        # ulasiyor (yarim kalsa bile o ana kadarki ilerleme kaybolmuyor), ama zaman asimina
        # ugramadan TAM bitmesi icin bolluk payi verildi.
        timeout-minutes: 150

      - name: Değişiklikleri commit et
        if: always()
        # NOT (2026-08-11): önceden burada git rebase kullanılıyordu - tarama 2.5 saate kadar
        # sürebildiği için o kadar uzun sürede leads.json GitHub'da başka commit'lerle defalarca
        # değişiyor, ve git bu büyüklükte bir JSON blob'unu satır bazında güvenilir uzlaştıramıyor
        # (gerçek bir taramada CONFLICT verip TÜM taramanın kaybolmasına yol açtı). Artık git hiç
        # satır-uzlaşması yapmıyor: origin/main'in TAZE leads.json'u çekilir, sadece BU taramanın
        # kendi bulduğu yeni kayıtlar (new_leads_this_run.json, run_discovery.py tarafından
        # aralıksız güncellenir) Python/dedupe seviyesinde üzerine eklenir (scripts/merge_new_
        # leads.py). Son saniyede başka bir push araya girerse (küçük bir yarış penceresi kaldı,
        # ama artık saniyeler mertebesinde, saatler değil) birkaç kez yeniden dener.
        run: |
          git config user.name "fleetparts-discovery-bot"
          git config user.email "actions@github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git checkout origin/main -- leads.json
            python scripts/merge_new_leads.py
            git add leads.json
            if git diff --staged --quiet; then
              echo "Değişiklik yok (yeni lead bulunamadı ya da hepsi zaten mevcut)."
              break
            fi
            git commit -m "Otomatik lead taraması $(date -u +%Y-%m-%d)"
            if git push origin HEAD:main; then
              echo "Push başarılı (deneme $i)."
              break
            fi
            echo "Push başarısız (deneme $i/5), yeniden denenecek..."
            git reset --soft HEAD~1
            sleep 5
          done
