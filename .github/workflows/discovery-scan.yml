name: Haftalık Lead Keşif Taraması

on:
  schedule:
    - cron: '17 2 * * 1'  # Her Pazartesi 02:17 UTC - tam saatten kaydırılmış, yoğunluk saatini atlar
  workflow_dispatch: {}

concurrency:
  group: discovery-scan
  cancel-in-progress: false  # yeni koşu, öncekini iptal etmez, kuyrukta bekler - leads.json çakışmasını önler

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bağımlılıkları kur
        run: pip install requests

      - name: Taramayı çalıştır
        run: python scripts/run_discovery.py
        # NOT: 45dk gercek bir kosuda YETERSIZ cikti (2026-08-10) - Overpass sunuculari o gun
        # cok yavasti, eklenen retry/backoff mantigi (veri kaybini onlemek icin gerekli) taramayi
        # guvenilir ama daha uzun surdurebiliyor. Is "if: always()" ile commit adimina her turlu
        # ulasiyor (yarim kalsa bile o ana kadarki ilerleme kaybolmuyor), ama zaman asimina
        # ugramadan TAM bitmesi icin bolluk payi verildi.
        timeout-minutes: 150

      - name: Değişiklikleri commit et
        if: always()
        run: |
          git config user.name "fleetparts-discovery-bot"
          git config user.email "actions@github.com"
          git add leads.json
          git diff --staged --quiet || git commit -m "Otomatik lead taraması $(date -u +%Y-%m-%d)"
          git fetch origin main
          git rebase origin/main
          git push
